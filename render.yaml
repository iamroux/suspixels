services:
  - type: web
    name: suspixels-api
    env: node
    plan: free
    region: singapore
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    buildFilter:
      paths:
        - src/**
        - package.json
        - package-lock.json
        - tsconfig*.json
        - nest-cli.json
        - Dockerfile
        - render.yaml
      ignoredPaths:
        - frontend/**
        - DEPLOYMENT.md
        - README.md
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_PORT
        value: 10000
      - key: DATABASE_TYPE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_ENABLED
        value: 'true'
      - key: DATABASE_REJECT_UNAUTHORIZED
        value: 'false'
      - key: DATABASE_SYNCHRONIZE
        value: 'true'
      - key: REDIS_URL
        sync: false
      - key: APP_CORS_ORIGINS
        sync: false
