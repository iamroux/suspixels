name: Weekly DB Backup

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: none

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install postgresql-client-18
        run: |
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          # --schema=public: Supabase has internal auth/storage/realtime schemas
          # we must NOT back up. --no-owner/--no-privileges: keep dumps portable
          # so a restore doesn't choke on provider-specific roles.
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" \
            --schema=public --no-owner --no-privileges \
            | gzip > "backup_$(date +%Y-%m-%d).sql.gz"

      - name: Upload to Vercel Blob and prune old backups
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          npm install --no-save @vercel/blob
          node - <<'EOF'
          const { put, list, del } = require('@vercel/blob');
          const fs = require('fs');

          async function main() {
            // Find the dump file created in the previous step
            const file = fs.readdirSync('.')
              .find(f => f.startsWith('backup_') && f.endsWith('.sql.gz'));
            if (!file) throw new Error('No backup file found');

            // Upload
            const data = fs.readFileSync(file);
            const result = await put('db-backups/' + file, data, {
              access: 'private',      // store is private — backups are not publicly accessible
              addRandomSuffix: false, // keep the date-based name predictable
            });
            console.log('Uploaded:', result.url);

            // List all backups, sort oldest-first by pathname
            const { blobs } = await list({ prefix: 'db-backups/backup_' });
            blobs.sort((a, b) => a.pathname.localeCompare(b.pathname));
            console.log('All backups:', blobs.map(b => b.pathname));

            // Delete everything except the 3 most recent
            const toDelete = blobs.slice(0, Math.max(0, blobs.length - 3));
            for (const blob of toDelete) {
              await del(blob.url);
              console.log('Deleted:', blob.pathname);
            }
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF
