name: Weekly DB Backup

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client-18
        run: |
          sudo apt-get install -y curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          /usr/lib/postgresql/18/bin/pg_dump "$DATABASE_URL" | gzip > "db_backups/backup_$(date +%Y-%m-%d).sql.gz"

      - name: Keep only 3 most recent backups
        run: |
          ls -1 db_backups/backup_*.sql.gz 2>/dev/null | sort | head -n -3 | xargs -r rm

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add db_backups/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "backup: $(date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
